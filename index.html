<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Anafé 🌼</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    overflow-x:hidden;
    background:
        radial-gradient(circle at 50% 70%, #32152f 0%, #190d1d 45%, #0d0710 100%);
    color:#f8e9d1;
    font-family:'Cormorant Garamond',serif;
}

/* =========================
   FONDO
========================= */

#app{
    position:relative;
    min-height:100vh;
    overflow:hidden;
}

.glow{
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,190,90,.10),transparent 65%);
    left:50%;
    top:55%;
    transform:translate(-50%,-50%);
    pointer-events:none;
}

.spark{
    position:absolute;
    width:3px;
    height:3px;
    background:#ffd98c;
    border-radius:50%;
    box-shadow:0 0 10px #ffd98c;
    opacity:.7;
    animation:twinkle 3s infinite ease-in-out;
}

@keyframes twinkle{
    0%,100%{opacity:.15;transform:scale(.6)}
    50%{opacity:1;transform:scale(1.3)}
}

/* =========================
   PORTADA
========================= */

#portada{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    transition:opacity 1s ease, transform 1s ease;
    position:relative;
    z-index:20;
}

#portada.oculta{
    opacity:0;
    transform:scale(1.04);
    pointer-events:none;
}

.portada-contenido{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
}

.flor-mini{
    width:60px;
    height:60px;
    filter:drop-shadow(0 0 12px rgba(255,190,70,.45));
}

.para{
    font-size:2rem;
    letter-spacing:3px;
}

.anafe{
    font-family:'Great Vibes',cursive;
    font-size:clamp(4rem,10vw,7rem);
    line-height:.8;
    color:#ffd5c5;
    text-shadow:
        0 0 15px rgba(255,170,150,.25),
        0 0 35px rgba(190,110,170,.18);
}

.subtitulo{
    color:#cbb4c7;
    font-size:1rem;
    letter-spacing:3px;
    margin-top:5px;
}

.abrir{
    margin-top:20px;
    padding:13px 38px;
    border:1px solid rgba(255,190,180,.75);
    border-radius:50px;
    background:rgba(255,255,255,.035);
    color:#ffe7dc;
    font-family:'Cormorant Garamond',serif;
    font-size:1.25rem;
    cursor:pointer;
    transition:.35s ease;
    box-shadow:
        0 0 15px rgba(255,150,160,.08),
        inset 0 0 15px rgba(255,255,255,.02);
}

.abrir:hover{
    transform:translateY(-3px);
    background:rgba(255,180,170,.09);
    box-shadow:0 0 25px rgba(255,150,160,.2);
}

/* =========================
   ESCENA
========================= */

#escena{
    position:absolute;
    inset:0;
    min-height:100vh;
    opacity:0;
    pointer-events:none;
    transition:opacity 1.5s ease;
}

#escena.visible{
    opacity:1;
    pointer-events:auto;
}

/* =========================
   RAMO SVG
========================= */

.bouquet{
    position:absolute;
    left:50%;
    bottom:2vh;
    transform:translateX(-50%);
    width:min(620px,88vw);
    height:82vh;
    overflow:visible;
}

/* tallo principal */

.main-stem{
    stroke:#628f36;
    stroke-width:7;
    stroke-linecap:round;
    fill:none;
    stroke-dasharray:900;
    stroke-dashoffset:900;
    animation:growStem 3s ease-out forwards;
}

@keyframes growStem{
    to{stroke-dashoffset:0}
}

/* ramas */

.branch{
    stroke:#638e39;
    stroke-width:5;
    stroke-linecap:round;
    fill:none;
    stroke-dasharray:300;
    stroke-dashoffset:300;
    opacity:0;
}

#branch1{animation:growBranch 1.2s 2.1s ease-out forwards}
#branch2{animation:growBranch 1.2s 2.5s ease-out forwards}
#branch3{animation:growBranch 1.2s 2.9s ease-out forwards}
#branch4{animation:growBranch 1.2s 3.3s ease-out forwards}
#branch5{animation:growBranch 1.2s 3.7s ease-out forwards}
#branch6{animation:growBranch 1.2s 4.1s ease-out forwards}

@keyframes growBranch{
    to{
        stroke-dashoffset:0;
        opacity:1;
    }
}

/* hojas */

.leaf{
    transform-box:fill-box;
    transform-origin:center;
    opacity:0;
    transform:scale(0);
}

.leaf:nth-of-type(1){animation:leafIn .7s 2.5s forwards}
.leaf:nth-of-type(2){animation:leafIn .7s 2.8s forwards}
.leaf:nth-of-type(3){animation:leafIn .7s 3.0s forwards}
.leaf:nth-of-type(4){animation:leafIn .7s 3.2s forwards}
.leaf:nth-of-type(5){animation:leafIn .7s 3.4s forwards}
.leaf:nth-of-type(6){animation:leafIn .7s 3.6s forwards}
.leaf:nth-of-type(7){animation:leafIn .7s 3.8s forwards}
.leaf:nth-of-type(8){animation:leafIn .7s 4s forwards}
.leaf:nth-of-type(9){animation:leafIn .7s 4.2s forwards}
.leaf:nth-of-type(10){animation:leafIn .7s 4.4s forwards}
.leaf:nth-of-type(11){animation:leafIn .7s 4.6s forwards}
.leaf:nth-of-type(12){animation:leafIn .7s 4.8s forwards}

@keyframes leafIn{
    0%{
        opacity:0;
        transform:scale(0) rotate(-20deg);
    }
    100%{
        opacity:1;
        transform:scale(1) rotate(0);
    }
}

/* =========================
   FLORES
========================= */

.flower{
    transform-box:fill-box;
    transform-origin:center;
    opacity:0;
    transform:scale(.15);
}

.flower:nth-of-type(1){animation:bloom .9s 4.6s ease-out forwards}
.flower:nth-of-type(2){animation:bloom .9s 5.0s ease-out forwards}
.flower:nth-of-type(3){animation:bloom .9s 5.4s ease-out forwards}
.flower:nth-of-type(4){animation:bloom .9s 5.8s ease-out forwards}
.flower:nth-of-type(5){animation:bloom .9s 6.2s ease-out forwards}
.flower:nth-of-type(6){animation:bloom .9s 6.6s ease-out forwards}
.flower:nth-of-type(7){animation:bloom .9s 7.0s ease-out forwards}
.flower:nth-of-type(8){animation:bloom .9s 7.4s ease-out forwards}

@keyframes bloom{
    0%{
        opacity:0;
        transform:scale(.1) rotate(-12deg);
    }
    65%{
        opacity:1;
        transform:scale(1.12) rotate(4deg);
    }
    100%{
        opacity:1;
        transform:scale(1) rotate(0);
    }
}

.petal-yellow{
    fill:#f4bd3f;
    stroke:#ffd86b;
    stroke-width:1.5;
}

.petal-light{
    fill:#ffe7a1;
    stroke:#fff0bd;
    stroke-width:1.4;
}

.center{
    fill:#e99028;
    stroke:#ffc65a;
    stroke-width:2;
}

/* =========================
   MOÑO
========================= */

.ribbon{
    opacity:0;
    animation:ribbonIn 1.2s 7.9s ease-out forwards;
}

@keyframes ribbonIn{
    from{
        opacity:0;
        transform:translateY(15px) scale(.7);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.ribbon-fill{
    fill:#eaa0a1;
    stroke:#ffc2bc;
    stroke-width:2;
}

/* =========================
   PÉTALOS FLOTANTES
========================= */

.petal{
    position:absolute;
    width:10px;
    height:18px;
    background:#f5b7b0;
    border-radius:100% 0 100% 0;
    opacity:0;
    animation:fall 8s linear infinite;
}

.petal:nth-child(1){left:15%;animation-delay:1s}
.petal:nth-child(2){left:27%;animation-delay:4s}
.petal:nth-child(3){left:72%;animation-delay:2s}
.petal:nth-child(4){left:84%;animation-delay:5s}
.petal:nth-child(5){left:42%;animation-delay:7s}
.petal:nth-child(6){left:60%;animation-delay:3s}

@keyframes fall{
    0%{
        top:-5%;
        opacity:0;
        transform:rotate(0deg) translateX(0);
    }
    15%{opacity:.8}
    50%{
        transform:rotate(180deg) translateX(50px);
    }
    85%{opacity:.45}
    100%{
        top:105%;
        opacity:0;
        transform:rotate(360deg) translateX(-40px);
    }
}

/* =========================
   MENSAJE
========================= */

.mensaje{
    position:absolute;
    top:7vh;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    width:min(520px,88vw);
    text-align:center;
    opacity:0;
    animation:messageIn 1.5s 8.7s ease-out forwards;
}

@keyframes messageIn{
    to{
        opacity:1;
        transform:translateX(-50%) translateY(0);
    }
}

.mensaje h2{
    font-size:clamp(1.8rem,4vw,2.6rem);
    line-height:1.1;
    font-weight:500;
    color:#f9dfb5;
}

.mensaje h2 span{
    display:block;
    font-family:'Great Vibes',cursive;
    font-size:clamp(2.8rem,7vw,4rem);
    color:#f2b7a8;
    margin-top:5px;
}

.mensaje p{
    margin-top:16px;
    color:#ded0d8;
    font-size:clamp(1.05rem,2.5vw,1.35rem);
    line-height:1.35;
}

.mensaje strong{
    display:block;
    margin-top:8px;
    font-size:1.35rem;
    color:#f2b0c1;
}

/* =========================
   BOTÓN FINAL
========================= */

.final{
    position:absolute;
    bottom:5vh;
    left:50%;
    transform:translateX(-50%) translateY(15px);
    opacity:0;
    animation:finalIn 1.2s 9.8s ease-out forwards;
}

.final a{
    text-decoration:none;
    color:#f9d6ce;
    font-size:1.4rem;
    letter-spacing:1px;
    padding:12px 25px;
    border-bottom:1px solid rgba(255,190,170,.5);
    transition:.3s ease;
}

.final a:hover{
    color:#fff0e8;
    text-shadow:0 0 15px rgba(255,180,160,.5);
}

@keyframes finalIn{
    to{
        opacity:1;
        transform:translateX(-50%) translateY(0);
    }
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px){

    .bouquet{
        width:105vw;
        height:70vh;
        bottom:4vh;
    }

    .mensaje{
        top:4vh;
    }

    .mensaje h2{
        font-size:1.55rem;
    }

    .mensaje h2 span{
        font-size:3rem;
    }

    .mensaje p{
        font-size:1rem;
    }

    .mensaje strong{
        font-size:1.15rem;
    }

    .final{
        bottom:2.5vh;
    }

    .final a{
        font-size:1.15rem;
    }

    .para{
        font-size:1.5rem;
    }

    .anafe{
        font-size:5rem;
    }
}
</style>
</head>
