<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Anafé 🌼</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

    <div class="glow"></div>

    <!-- =====================================
         PORTADA
    ====================================== -->
    <section id="portada">
        <div class="portada-contenido">

            <svg class="flor-portada" viewBox="0 0 100 100">
                <ellipse cx="50" cy="27" rx="13" ry="22" fill="#ffe8a5"/>
                <ellipse cx="73" cy="50" rx="22" ry="13" fill="#ffd86b"/>
                <ellipse cx="50" cy="73" rx="13" ry="22" fill="#ffe8a5"/>
                <ellipse cx="27" cy="50" rx="22" ry="13" fill="#ffd86b"/>
                <circle cx="50" cy="50" r="13" fill="#e99729"/>
            </svg>

            <div class="para">Para</div>
            <div class="anafe">Anafé</div>
            <div class="subtitulo">algo pequeño, pero especial</div>

            <button class="abrir" id="btnAbrir" type="button">Abrir →</button>

        </div>
    </section>

    <!-- =====================================
         ESCENA
    ====================================== -->
    <section id="escena">

        <!-- Frase que va narrando el crecimiento (como en tu boceto) -->
        <div class="stage-caption" id="stageCaption"></div>

        <!-- PÉTALOS -->
        <div class="petalo"></div>
        <div class="petalo"></div>
        <div class="petalo"></div>
        <div class="petalo"></div>
        <div class="petalo"></div>
        <div class="petalo"></div>

        <!-- Ramo a un lado y mensaje/reproductor al otro, sin pisarse -->
        <div class="escena-layout">

        <div class="ramo-col">
        <!-- ================= RAMO ================= -->
        <svg class="bouquet" viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">

            <!-- TALLO -->
            <path class="main-stem" d="
                M300 870 C300 760 300 650 300 550
                C300 450 300 340 300 230
                C300 160 300 100 300 50
            "/>

            <!-- RAMAS -->
            <path class="branch branch-1" d="M300 700 C250 625 195 560 140 500"/>
            <path class="branch branch-2" d="M300 610 C350 535 410 475 475 400"/>
            <path class="branch branch-3" d="M300 520 C245 450 210 390 180 310"/>
            <path class="branch branch-4" d="M300 440 C355 370 415 315 465 245"/>
            <path class="branch branch-5" d="M300 350 C260 295 225 245 215 185"/>
            <path class="branch branch-6" d="M300 265 C350 205 385 150 400 95"/>

            <!-- HOJAS -->
            <g fill="#71983b">
                <ellipse class="leaf" style="--delay:2.8s" cx="245" cy="625" rx="13" ry="35" transform="rotate(-55 245 625)"/>
                <ellipse class="leaf" style="--delay:3s"   cx="215" cy="580" rx="13" ry="34" transform="rotate(55 215 580)"/>
                <ellipse class="leaf" style="--delay:3.2s" cx="355" cy="550" rx="13" ry="36" transform="rotate(55 355 550)"/>
                <ellipse class="leaf" style="--delay:3.4s" cx="390" cy="505" rx="13" ry="34" transform="rotate(-55 390 505)"/>
                <ellipse class="leaf" style="--delay:3.6s" cx="250" cy="465" rx="13" ry="34" transform="rotate(-55 250 465)"/>
                <ellipse class="leaf" style="--delay:3.8s" cx="220" cy="420" rx="13" ry="34" transform="rotate(55 220 420)"/>
                <ellipse class="leaf" style="--delay:4s"   cx="355" cy="395" rx="13" ry="34" transform="rotate(55 355 395)"/>
                <ellipse class="leaf" style="--delay:4.2s" cx="390" cy="350" rx="13" ry="34" transform="rotate(-55 390 350)"/>
                <ellipse class="leaf" style="--delay:4.4s" cx="260" cy="315" rx="13" ry="34" transform="rotate(-55 260 315)"/>
                <ellipse class="leaf" style="--delay:4.6s" cx="245" cy="265" rx="13" ry="34" transform="rotate(55 245 265)"/>
                <ellipse class="leaf" style="--delay:4.8s" cx="350" cy="235" rx="13" ry="34" transform="rotate(55 350 235)"/>
                <ellipse class="leaf" style="--delay:5s"   cx="370" cy="185" rx="13" ry="34" transform="rotate(-55 370 185)"/>
            </g>

            <!-- ================= FLORES ================= -->

            <g transform="translate(140 500)">
                <g class="flower-bloom" style="--delay:4.8s">
                    <ellipse class="petal-yellow" cx="0" cy="-30" rx="17" ry="29"/>
                    <ellipse class="petal-light" cx="29" cy="-10" rx="17" ry="29" transform="rotate(65 29 -10)"/>
                    <ellipse class="petal-yellow" cx="18" cy="22" rx="17" ry="29" transform="rotate(130 18 22)"/>
                    <ellipse class="petal-light" cx="-18" cy="22" rx="17" ry="29" transform="rotate(-130 -18 22)"/>
                    <ellipse class="petal-yellow" cx="-29" cy="-10" rx="17" ry="29" transform="rotate(-65 -29 -10)"/>
                    <circle class="flower-center" cx="0" cy="0" r="13"/>
                </g>
            </g>

            <g transform="translate(475 400)">
                <g class="flower-bloom" style="--delay:5.2s">
                    <ellipse class="petal-light" cx="0" cy="-29" rx="16" ry="28"/>
                    <ellipse class="petal-yellow" cx="28" cy="-9" rx="16" ry="28" transform="rotate(65 28 -9)"/>
                    <ellipse class="petal-light" cx="17" cy="21" rx="16" ry="28" transform="rotate(130 17 21)"/>
                    <ellipse class="petal-yellow" cx="-17" cy="21" rx="16" ry="28" transform="rotate(-130 -17 21)"/>
                    <ellipse class="petal-light" cx="-28" cy="-9" rx="16" ry="28" transform="rotate(-65 -28 -9)"/>
                    <circle class="flower-center" cx="0" cy="0" r="12"/>
                </g>
            </g>

            <g transform="translate(180 310)">
                <g class="flower-bloom" style="--delay:5.6s">
                    <ellipse class="petal-yellow" cx="0" cy="-28" rx="15" ry="27"/>
                    <ellipse class="petal-light" cx="27" cy="-8" rx="15" ry="27" transform="rotate(65 27 -8)"/>
                    <ellipse class="petal-yellow" cx="16" cy="20" rx="15" ry="27" transform="rotate(130 16 20)"/>
                    <ellipse class="petal-light" cx="-16" cy="20" rx="15" ry="27" transform="rotate(-130 -16 20)"/>
                    <ellipse class="petal-yellow" cx="-27" cy="-8" rx="15" ry="27" transform="rotate(-65 -27 -8)"/>
                    <circle class="flower-center" cx="0" cy="0" r="12"/>
                </g>
            </g>

            <g transform="translate(465 245)">
                <g class="flower-bloom" style="--delay:6s">
                    <ellipse class="petal-yellow" cx="0" cy="-30" rx="17" ry="29"/>
                    <ellipse class="petal-light" cx="29" cy="-10" rx="17" ry="29" transform="rotate(65 29 -10)"/>
                    <ellipse class="petal-yellow" cx="18" cy="22" rx="17" ry="29" transform="rotate(130 18 22)"/>
                    <ellipse class="petal-light" cx="-18" cy="22" rx="17" ry="29" transform="rotate(-130 -18 22)"/>
                    <ellipse class="petal-yellow" cx="-29" cy="-10" rx="17" ry="29" transform="rotate(-65 -29 -10)"/>
                    <circle class="flower-center" cx="0" cy="0" r="13"/>
                </g>
            </g>

            <g transform="translate(215 185)">
                <g class="flower-bloom" style="--delay:6.4s">
                    <ellipse class="petal-light" cx="0" cy="-27" rx="15" ry="26"/>
                    <ellipse class="petal-yellow" cx="26" cy="-9" rx="15" ry="26" transform="rotate(65 26 -9)"/>
                    <ellipse class="petal-light" cx="16" cy="19" rx="15" ry="26" transform="rotate(130 16 19)"/>
                    <ellipse class="petal-yellow" cx="-16" cy="19" rx="15" ry="26" transform="rotate(-130 -16 19)"/>
                    <ellipse class="petal-light" cx="-26" cy="-9" rx="15" ry="26" transform="rotate(-65 -26 -9)"/>
                    <circle class="flower-center" cx="0" cy="0" r="11"/>
                </g>
            </g>

            <g transform="translate(400 95)">
                <g class="flower-bloom" style="--delay:6.8s">
                    <ellipse class="petal-yellow" cx="0" cy="-27" rx="15" ry="26"/>
                    <ellipse class="petal-light" cx="26" cy="-9" rx="15" ry="26" transform="rotate(65 26 -9)"/>
                    <ellipse class="petal-yellow" cx="16" cy="19" rx="15" ry="26" transform="rotate(130 16 19)"/>
                    <ellipse class="petal-light" cx="-16" cy="19" rx="15" ry="26" transform="rotate(-130 -16 19)"/>
                    <ellipse class="petal-yellow" cx="-26" cy="-9" rx="15" ry="26" transform="rotate(-65 -26 -9)"/>
                    <circle class="flower-center" cx="0" cy="0" r="11"/>
                </g>
            </g>

            <g transform="translate(300 120)">
                <g class="flower-bloom" style="--delay:7.2s">
                    <ellipse class="petal-light" cx="0" cy="-38" rx="20" ry="36"/>
                    <ellipse class="petal-yellow" cx="35" cy="-12" rx="20" ry="36" transform="rotate(65 35 -12)"/>
                    <ellipse class="petal-light" cx="22" cy="28" rx="20" ry="36" transform="rotate(130 22 28)"/>
                    <ellipse class="petal-yellow" cx="-22" cy="28" rx="20" ry="36" transform="rotate(-130 -22 28)"/>
                    <ellipse class="petal-light" cx="-35" cy="-12" rx="20" ry="36" transform="rotate(-65 -35 -12)"/>
                    <circle class="flower-center" cx="0" cy="0" r="15"/>
                </g>
            </g>

            <g transform="translate(355 205)">
                <g class="flower-bloom" style="--delay:7.6s">
                    <circle class="flower-center" cx="0" cy="0" r="9"/>
                    <ellipse class="petal-light" cx="0" cy="-22" rx="11" ry="20"/>
                    <ellipse class="petal-light" cx="22" cy="0" rx="11" ry="20" transform="rotate(90 22 0)"/>
                    <ellipse class="petal-light" cx="0" cy="22" rx="11" ry="20"/>
                    <ellipse class="petal-light" cx="-22" cy="0" rx="11" ry="20" transform="rotate(90 -22 0)"/>
                </g>
            </g>

            <!-- MOÑO -->
            <g class="ribbon">
                <path class="ribbon-fill" d="M300 750 C245 715 205 740 215 780 C225 815 270 805 300 775 Z"/>
                <path class="ribbon-fill" d="M300 750 C355 715 395 740 385 780 C375 815 330 805 300 775 Z"/>
                <path class="ribbon-fill" d="M288 770 L260 855 L300 825 L340 855 L312 770 Z"/>
                <ellipse cx="300" cy="765" rx="25" ry="20" fill="#d98991" stroke="#ffc2bc" stroke-width="2"/>
            </g>
        </svg>
        </div><!-- /.ramo-col -->

        <div class="contenido-col">

        <!-- ================= MENSAJE ================= -->
        <div class="mensaje">
            <h2>
                Te entrego de manera muy especial
                <span>"Conocida".</span>
            </h2>
            <p>Siempre te desearé lo mejor y que cumplas todas tus metas.</p>
            <strong>Tú puedes con todo.</strong>
        </div>

        <!-- ================= REPRODUCTOR ================= -->
        <div class="final">

            <div class="player-card" id="playerCard">

                <div class="player-top">
                    <div class="album-art">
                        <svg viewBox="0 0 100 100" width="100%" height="100%">
                            <defs>
                                <radialGradient id="albumGrad" cx="50%" cy="35%" r="75%">
                                    <stop offset="0%" stop-color="#ffdf9a"/>
                                    <stop offset="100%" stop-color="#e07a5f"/>
                                </radialGradient>
                            </defs>
                            <rect width="100" height="100" rx="14" fill="url(#albumGrad)"/>
                            <circle cx="50" cy="42" r="16" fill="#fff3d6" opacity=".85"/>
                            <circle cx="50" cy="42" r="6" fill="#e99327"/>
                        </svg>
                    </div>

                    <div class="track-info">
                        <div class="track-title">Do Better</div>
                        <div class="track-artist">Cuco</div>
                    </div>

                    <div class="brand" title="Spotify">
                        <svg viewBox="0 0 24 24" width="18" height="18">
                            <circle cx="12" cy="12" r="11" fill="#1DB954"/>
                            <path d="M6.5 9.8c3-0.8 7-0.5 9.8 1.1M7 13.2c2.6-0.6 6-0.4 8.3 1M7.4 16.3c2.1-0.4 4.8-0.3 6.6 0.8"
                                  stroke="#0c0710" stroke-width="1.4" stroke-linecap="round" fill="none"/>
                        </svg>
                        <span>Spotify</span>
                    </div>
                </div>

                <div class="progress-row">
                    <span class="time time-current" id="timeCurrent">0:00</span>
                    <div class="progress-track" id="progressTrack">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span class="time time-total" id="timeTotal">0:00</span>
                </div>

                <div class="controls-row">

                    <button class="ctrl-btn" id="btnShuffle" type="button" title="Aleatorio" aria-disabled="true">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path d="M3 6h3.5L15 18h6M3 18h3.5L11 12M15 6h6"/>
                            <path d="M18 3l3 3-3 3M18 15l3 3-3 3"/>
                        </svg>
                    </button>

                    <button class="ctrl-btn" id="btnPrev" type="button" title="Reiniciar">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M6 6h2v12H6zM20 6L10 12l10 6z"/>
                        </svg>
                    </button>

                    <button class="play-btn" id="btnPlay" type="button" title="Reproducir">
                        <svg id="iconPlay" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <svg id="iconPause" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" style="display:none">
                            <path d="M6 5h4v14H6zM14 5h4v14h-4z"/>
                        </svg>
                    </button>

                    <button class="ctrl-btn" id="btnNext" type="button" title="Siguiente" aria-disabled="true">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M16 6h2v12h-2zM4 6l10 6-10 6z"/>
                        </svg>
                    </button>

                    <button class="ctrl-btn heart-btn" id="btnHeart" type="button" title="Me gusta">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path d="M12 20s-7-4.35-9.5-8.8C.7 7.9 2.4 4.5 6 4.5c2 0 3.4 1.1 6 3.6 2.6-2.5 4-3.6 6-3.6 3.6 0 5.3 3.4 3.5 6.7C19 15.65 12 20 12 20z"/>
                        </svg>
                    </button>

                </div>

                <p class="player-hint" id="playerHint">Toca para escuchar aquí mismo</p>
            </div>

            <p class="final-note">✨ Que la vida siempre te sorprenda ✨</p>
        </div><!-- /.final -->

        </div><!-- /.contenido-col -->

        </div><!-- /.escena-layout -->

        <!-- Contenedor invisible donde vive el reproductor real de Spotify -->
        <div id="spotify-embed" class="spotify-mount"></div>

    </section>
</div>

<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
<script src="script.js"></script>
</body>
</html>
