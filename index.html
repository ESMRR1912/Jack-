<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Anafé 🌼</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: linear-gradient(135deg, #180d1f, #24112d, #111b18);
            font-family: Georgia, 'Times New Roman', serif;
        }

        .portada {
            text-align: center;
            animation: aparecer 2s ease;
        }

        .decoracion {
            font-size: 22px;
            margin-bottom: 25px;
            letter-spacing: 15px;
            opacity: 0.8;
        }

        h1 {
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 400;
            font-style: italic;
            background: linear-gradient(
                90deg,
                #ff9fcf,
                #c99cff,
                #9de3ad,
                #ff9fcf
            );
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: colores 6s ease infinite;
            margin-bottom: 45px;
        }

        .abrir {
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            padding: 14px 38px;
            border-radius: 50px;
            font-size: 17px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: 0.4s ease;
        }

        .abrir:hover {
            transform: scale(1.08);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 30px rgba(255, 180, 220, 0.25);
        }

        .flor {
            position: absolute;
            opacity: 0.7;
            animation: flotar 5s ease-in-out infinite;
        }

        .flor1 {
            top: 15%;
            left: 15%;
        }

        .flor2 {
            bottom: 18%;
            right: 15%;
            animation-delay: 1.5s;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes colores {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes flotar {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-12px) rotate(5deg);
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 3.4rem;
            }

            .decoracion {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <div class="flor flor1">🌼</div>
    <div class="flor flor2">🌼</div>

    <main class="portada">

        <div class="decoracion">
            ✦　🌿　✦
        </div>

        <h1>Para Anafé</h1>

        <button class="abrir" onclick="abrirPagina()">
            Abrir
        </button>

    </main>

    <script>
        function abrirPagina() {
            alert("🌼 Aquí comenzará nuestra historia...");
        }
    </script>

</body>
</html>
